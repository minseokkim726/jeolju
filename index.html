<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="절주노트">
<title>절주노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="demo-band" class="demo-band" hidden>예시 데이터를 보고 있어요 · <a href="./">실제 앱으로</a></div>
  <main id="screen" tabindex="-1"><p class="loading">불러오는 중…</p></main>
  <nav class="tabs" id="tabs" aria-label="화면 이동">
    <a href="#/today" data-tab="today">오늘</a>
    <a href="#/cal" data-tab="cal">달력</a>
    <a href="#/stats" data-tab="stats">통계</a>
    <a href="#/goals" data-tab="goals">목표</a>
  </nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" class="dialog"></dialog>
<script type="module" src="js/main.js"></script>
<script>
  setTimeout(function () {
    var el = document.querySelector('#screen .loading');
    if (!el) return;
    el.innerHTML = '앱을 여는 데 시간이 걸리고 있어요.<br><button type="button" class="btn primary" style="margin-top:12px" onclick="location.reload()">다시 열기</button>';
  }, 8000);
</script>
</body>
</html>
